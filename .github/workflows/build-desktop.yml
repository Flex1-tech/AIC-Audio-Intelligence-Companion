---
# ═══════════════════════════════════════════════════════════════════════════════
#  AIC — Desktop Builds & Distribution Pipeline (Windows · Linux · macOS)
#  Référence Flet 0.86 : https://docs.flet.dev/publish
# ═══════════════════════════════════════════════════════════════════════════════
#
#  DÉCLENCHEURS
#  ┌─ push sur main            → CI build complet des 3 plateformes
#  ├─ push d'un tag v*         → CI build + Packaging natif + GitHub Release
#  └─ workflow_dispatch        → déclenchement manuel
#
#  PACKAGES PUBLIÉS SUR TAG v*
#  • Windows : AIC-Setup-vX.Y.Z.exe (Inno Setup) + AIC-Portable-vX.Y.Z.zip
#  • Linux   : AIC-vX.Y.Z.AppImage (appimagetool)
#  • macOS   : AIC-vX.Y.Z.dmg (create-dmg, Apple Silicon arm64)
# ═══════════════════════════════════════════════════════════════════════════════

name: "AIC — Desktop Builds & Distribution"

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1
  UV_PYTHON: "3.12"

jobs:
  build:
    name: "Build · ${{ matrix.platform }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:

          # ── Windows ────────────────────────────────────────────────────────
          - platform: windows
            runner: windows-latest
            artifact_path: build/windows

          # ── Linux ──────────────────────────────────────────────────────────
          - platform: linux
            runner: ubuntu-latest
            artifact_path: build/linux
            needs_linux_deps: true

          # ── macOS ──────────────────────────────────────────────────────────
          - platform: macos
            runner: macos-latest
            artifact_path: build/macos
            extra_args: "--arch arm64"

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: "Checkout repository"
        uses: actions/checkout@v4

      # ── 2. Setup uv ────────────────────────────────────────────────────────
      - name: "Setup uv"
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      # ── 3. Dépendances système Linux ─────────────────────────────────────────
      - name: "Linux system dependencies"
        if: matrix.needs_linux_deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build \
            libgtk-3-dev libasound2-dev \
            libmpv-dev mpv \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-tools \
            gstreamer1.0-x gstreamer1.0-alsa \
            gstreamer1.0-gl gstreamer1.0-gtk3 \
            gstreamer1.0-pulseaudio \
            pkg-config libsecret-1-dev \
            curl git unzip xz-utils zip
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
        shell: bash

      # ── 4. Sync dépendances ───────────────────────────────────────────────────
      - name: "uv sync (with dev group)"
        run: uv sync --group dev
        shell: bash

      # ── 5. Vérification flet CLI ─────────────────────────────────────────────
      - name: "flet --version"
        run: uv run flet --version
        shell: bash

      # ── 6. Vérification de cohérence de version (Tag vs pyproject.toml) ──────
      - name: "Validate version consistency (Release Tag vs pyproject.toml)"
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PYPROJECT_VERSION=$(grep -E '^version[[:space:]]*=' pyproject.toml | head -n1 | sed -E 's/version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')

          echo "=== VERSION CONSISTENCY CHECK ==="
          echo "Git Tag Version:       ${TAG_VERSION}"
          echo "pyproject.toml Version: ${PYPROJECT_VERSION}"

          if [ "${TAG_VERSION}" != "${PYPROJECT_VERSION}" ]; then
            echo "::error::VERSION MISMATCH DETECTED! Tag version (v${TAG_VERSION}) does not match pyproject.toml version (${PYPROJECT_VERSION})."
            exit 1
          fi
          echo "SUCCESS: Version consistency check passed (v${TAG_VERSION})."

      # ── 7. Pre-Build Native & Hidden Resources Audit (Windows) ─────────────
      - name: "Pre-Build Native & Hidden Resources Audit"
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $sp_root = (Get-Item ".venv\Lib\site-packages").FullName
          Write-Host "=== PRE-BUILD AUDIT ==="
          Write-Host "Site-packages path: $sp_root"

          $vcomp = Join-Path $sp_root "sklearn\.libs\vcomp140.dll"
          $msvcp = Join-Path $sp_root "sklearn\.libs\msvcp140.dll"
          Write-Host "sklearn\.libs\vcomp140.dll = $(if (Test-Path $vcomp) {'FOUND'} else {'MISSING'})"
          Write-Host "sklearn\.libs\msvcp140.dll = $(if (Test-Path $msvcp) {'FOUND'} else {'MISSING'})"

          $hidden_dirs = Get-ChildItem -Path $sp_root -Recurse -Directory | Where-Object { $_.Name -like ".*libs*" }
          Write-Host "Found $($hidden_dirs.Count) hidden native directories in .venv:"
          foreach ($d in $hidden_dirs) {
            Write-Host "  - $($d.FullName)"
          }

      # ── 8. Build ─────────────────────────────────────────────────────────────
      - name: "flet build ${{ matrix.platform }}"
        id: flet_build
        run: |
          uv run flet build ${{ matrix.platform }} \
            ${{ matrix.extra_args }} \
            --python-version 3.12 \
            --yes \
            --verbose \
            --no-rich-output
        shell: bash
        env:
          FLET_APP_NAME: "AIC"

      # ── 9. Embedded Bundle Hidden Native Resources Injection & Audit (Windows) ──
      - name: "Embedded Bundle Hidden Native Resources Injection & Audit"
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $sp_root = (Get-Item ".venv\Lib\site-packages").FullName
          $build_folder = "build\windows"

          if (!(Test-Path $build_folder)) {
            Write-Host "::error::Build folder $build_folder not found!"
            exit 1
          }

          Write-Host "=== POST-BUILD DYNAMIC EMBEDDED RUNTIME SEARCH ==="

          $target_site_packages = Get-ChildItem -Path $build_folder -Recurse -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq "site-packages" } |
            Select-Object -ExpandProperty FullName -Unique

          if ($null -eq $target_site_packages -or $target_site_packages.Count -eq 0) {
            Write-Host "::error::No site-packages directories found under $build_folder!"
            exit 1
          }

          Write-Host "Identified $($target_site_packages.Count) embedded site-packages runtime target(s):"
          foreach ($t in $target_site_packages) {
            Write-Host "  -> $t"
          }

          $hidden_dirs = Get-ChildItem -Path $sp_root -Recurse -Directory | Where-Object { $_.Name -like ".*libs*" }
          $injected_count = 0
          $copied_dlls = 0

          foreach ($hd in $hidden_dirs) {
            $rel_path = $hd.FullName.Substring($sp_root.Length).TrimStart('\', '/')
            foreach ($tsp in $target_site_packages) {
              $dest = Join-Path $tsp $rel_path
              if (!(Test-Path $dest)) {
                New-Item -ItemType Directory -Path $dest -Force | Out-Null
              }
              Copy-Item -Path "$($hd.FullName)\*" -Destination $dest -Recurse -Force
              $dll_files = Get-ChildItem -Path $hd.FullName -Recurse -File
              $copied_dlls += $dll_files.Count
              Write-Host "Injected $($hd.Name) ($($dll_files.Count) files) -> $dest"
              $injected_count++
            }
          }

          Write-Host "=== FINAL EMBEDDED BUNDLE INTEGRITY AUDIT ==="
          $failed_targets = 0
          foreach ($tsp in $target_site_packages) {
            $vcomp_target = Join-Path $tsp "sklearn\.libs\vcomp140.dll"
            $msvcp_target = Join-Path $tsp "sklearn\.libs\msvcp140.dll"

            $vcomp_status = if (Test-Path $vcomp_target) { 'FOUND' } else { 'MISSING' }
            $msvcp_status = if (Test-Path $msvcp_target) { 'FOUND' } else { 'MISSING' }

            Write-Host "Target [$tsp]:"
            Write-Host "  sklearn\.libs\vcomp140.dll = $vcomp_status"
            Write-Host "  sklearn\.libs\msvcp140.dll = $msvcp_status"

            if ($vcomp_status -ne 'FOUND' -or $msvcp_status -ne 'FOUND') {
              $failed_targets++
            }
          }

          if ($failed_targets -gt 0) {
            Write-Host "::error::CRITICAL NATIVE RESOURCE VERIFICATION FAILED! Missing required DLLs in $failed_targets target(s)."
            exit 1
          }

          $exe = "build\windows\AIC.exe"
          if (!(Test-Path $exe)) {
            $exe_candidates = @("build\windows\AIC.exe", "build\windows\x64\runner\Release\AIC.exe")
            foreach ($cand in $exe_candidates) {
              if (Test-Path $cand) { $exe = $cand; break }
            }
          }
          if (!(Test-Path $exe)) {
            Write-Host "::error::EXECUTABLE AIC.exe MISSING! Expected at build\windows\AIC.exe"
            exit 1
          }
          Write-Host "Executable verified: $exe = FOUND"

          $missing = @()
          $venv_dlls = Get-ChildItem -Path ".venv\Lib\site-packages" -Recurse -Include "*.dll", "*.pyd"
          foreach ($f in $venv_dlls) {
            $name = $f.Name
            $found = Get-ChildItem -Path $build_folder -Recurse -Filter $name -ErrorAction SilentlyContinue
            if (!$found) {
              $missing += "DLL/PYD: $name (from $($f.FullName))"
            }
          }

          if ($missing.Count -gt 0) {
            Write-Host "::error::PACKAGING INTEGRITY AUDIT FAILED! Missing $($missing.Count) native resources in build folder."
            foreach ($m in $missing) {
              Write-Host "  MISSING: $m"
            }
            exit 1
          } else {
            Write-Host "SUCCESS: Packaging Integrity Audit PASSED. All native binaries are present in embedded runtime bundle."
          }

      # ── 10. Startup Test & Crash Log Capture (Windows) ─────────────────────
      - name: "Run AIC.exe startup test & capture logs"
        if: matrix.platform == 'windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = "build\windows\AIC.exe"
          if (!(Test-Path $exe)) {
            $exe = "build\windows\x64\runner\Release\AIC.exe"
          }
          if (!(Test-Path $exe)) {
            Write-Host "::error::AIC.exe was not found in build\windows\AIC.exe"
            exit 1
          }
          Write-Host "Launching $exe for startup diagnostic test (12s)..."
          $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput stdout.txt -RedirectStandardError stderr.txt -NoNewWindow
          Start-Sleep -Seconds 12
          if (!$proc.HasExited) {
            $proc.Kill()
            Write-Host "Process running normally (killed after 12 seconds startup window — success)."
          } else {
            Write-Host "Process exited with code $($proc.ExitCode)"
          }

          if (Test-Path stdout.txt) { Write-Host "=== STDOUT ==="; Get-Content stdout.txt }
          if (Test-Path stderr.txt) { Write-Host "=== STDERR ==="; Get-Content stderr.txt }

          $appdata = $env:APPDATA
          $trace_candidates = @(
            "$appdata\AIC\logs\aic_boot_trace.log",
            "$env:USERPROFILE\aic_boot_trace.log",
            "aic_boot_trace.log",
            "build\windows\aic_boot_trace.log"
          )
          foreach ($f in $trace_candidates) {
            if (Test-Path $f) {
              Write-Host "=== aic_boot_trace.log ($f) ==="
              Get-Content $f
            }
          }

          $crash_candidates = @(
            "$appdata\AIC\logs\aic_crash.log",
            "$appdata\AIC\aic_crash.log",
            "$env:USERPROFILE\aic_crash.log",
            "aic_crash.log",
            "build\windows\aic_crash.log"
          )
          foreach ($f in $crash_candidates) {
            if (Test-Path $f) {
              Write-Host "=== aic_crash.log ($f) ==="
              Get-Content $f
            }
          }

      # ── 11. Bundle Size Measurement & Breakdown Audit ──────────────────────
      - name: "Bundle Size Measurement & Consumer Breakdown"
        shell: bash
        run: |
          echo "=== BUNDLE SIZE ANALYSIS (${{ matrix.platform }}) ==="
          BUILD_DIR="${{ matrix.artifact_path }}"
          if [ -d "$BUILD_DIR" ]; then
            TOTAL_SIZE=$(du -sh "$BUILD_DIR" | cut -f1)
            echo "Total Bundle Size: $TOTAL_SIZE"
            echo "--- Top 15 Largest Items ---"
            du -ah "$BUILD_DIR" | sort -rh | head -n 15
          else
            echo "Build directory $BUILD_DIR not found for size analysis."
          fi

      # ── 12. Packaging Windows (Inno Setup Installer + Portable ZIP) ────────
      - name: "Package Windows (Inno Setup + Portable ZIP)"
        if: matrix.platform == 'windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $TAG = "${env:GITHUB_REF}".Replace("refs/tags/", "")
          $VERSION_CLEAN = $TAG.TrimStart('v')

          Write-Host "=== WINDOWS PACKAGING (Tag: $TAG, Version: $VERSION_CLEAN) ==="
          New-Item -ItemType Directory -Path "dist_pkg" -Force | Out-Null

          # 1. Inno Setup Compilation
          Write-Host "Compiling Inno Setup Script (installer\AIC.iss)..."
          iscc "/DMyAppVersion=$VERSION_CLEAN" installer\AIC.iss

          $iss_output = "installer\Output\AIC-Setup-$VERSION_CLEAN.exe"
          if (!(Test-Path $iss_output)) {
            Write-Host "::error::Inno Setup compilation failed! $iss_output not generated."
            exit 1
          }

          $installer_dest = "dist_pkg\AIC-Setup-$TAG.exe"
          Move-Item -Path $iss_output -Destination $installer_dest -Force
          Write-Host "Installer created successfully: $installer_dest ($( (Get-Item $installer_dest).Length / 1MB ) MB)"

          # 2. Portable ZIP Creation
          $zip_dest = "dist_pkg\AIC-Portable-$TAG.zip"
          Write-Host "Creating Portable ZIP: $zip_dest..."
          Compress-Archive -Path "build\windows\*" -DestinationPath $zip_dest -CompressionLevel Optimal -Force
          Write-Host "Portable ZIP created successfully: $zip_dest ($( (Get-Item $zip_dest).Length / 1MB ) MB)"

      # ── 13. Packaging Linux (AppImage) ──────────────────────────────────────
      - name: "Package Linux (AppImage)"
        if: matrix.platform == 'linux' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION_CLEAN="${TAG#v}"

          echo "=== LINUX PACKAGING (Tag: ${TAG}, Version: ${VERSION_CLEAN}) ==="
          mkdir -p dist_pkg

          # Locate bundle directory
          BUNDLE_DIR=""
          for candidate in "build/linux/x64/release/bundle" "build/linux/bundle" "build/linux"; do
            if [ -f "${candidate}/AIC" ]; then
              BUNDLE_DIR="${candidate}"
              break
            fi
          done

          if [ -z "${BUNDLE_DIR}" ]; then
            echo "::error::Could not locate executable AIC inside build/linux/!"
            exit 1
          fi
          echo "Located Linux bundle at: ${BUNDLE_DIR}"

          # Construct AppDir
          rm -rf AppDir
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share

          # Copy bundle contents into AppDir/usr/
          cp -r ${BUNDLE_DIR}/* AppDir/usr/bin/

          # Create desktop file
          cat <<EOF > AppDir/AIC.desktop
          [Desktop Entry]
          Type=Application
          Name=AIC
          Comment=AIC — Audio Intelligence Companion
          Exec=AIC
          Icon=AIC
          Categories=AudioVideo;Audio;
          Terminal=false
          EOF

          # Copy icon
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png AppDir/AIC.png
          else
            echo "::warning::assets/icon.png missing, using placeholder icon."
            touch AppDir/AIC.png
          fi

          # AppRun launcher script
          cat <<'EOF' > AppDir/AppRun
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/bin:${HERE}/usr/bin/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/AIC" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Download appimagetool
          curl -sLO https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          # Build AppImage (ARCH=x86_64)
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir "dist_pkg/AIC-${TAG}.AppImage"
          chmod +x "dist_pkg/AIC-${TAG}.AppImage"

          if [ ! -f "dist_pkg/AIC-${TAG}.AppImage" ]; then
            echo "::error::AppImage generation failed!"
            exit 1
          fi
          echo "AppImage created successfully: dist_pkg/AIC-${TAG}.AppImage ($(du -h "dist_pkg/AIC-${TAG}.AppImage" | cut -f1))"

      # ── 14. Packaging macOS (DMG) ───────────────────────────────────────────
      - name: "Package macOS (DMG)"
        if: matrix.platform == 'macos' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION_CLEAN="${TAG#v}"

          echo "=== MACOS PACKAGING (Tag: ${TAG}, Version: ${VERSION_CLEAN}) ==="
          mkdir -p dist_pkg

          # Locate AIC.app
          APP_PATH=""
          for candidate in "build/macos/Build/Products/Release/AIC.app" "build/macos/bundle/AIC.app" "build/macos/AIC.app"; do
            if [ -d "${candidate}" ]; then
              APP_PATH="${candidate}"
              break
            fi
          done

          if [ -z "${APP_PATH}" ]; then
            echo "::error::Could not locate AIC.app inside build/macos/!"
            exit 1
          fi
          echo "Located AIC.app at: ${APP_PATH}"

          # Install create-dmg tool
          brew install create-dmg

          APP_DIR=$(dirname "${APP_PATH}")
          APP_NAME=$(basename "${APP_PATH}")

          create-dmg \
            --volname "AIC — Audio Intelligence Companion" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 120 \
            --icon "${APP_NAME}" 165 185 \
            --app-drop-link 495 185 \
            "dist_pkg/AIC-${TAG}.dmg" \
            "${APP_PATH}"

          if [ ! -f "dist_pkg/AIC-${TAG}.dmg" ]; then
            echo "::error::DMG generation failed!"
            exit 1
          fi
          echo "DMG created successfully: dist_pkg/AIC-${TAG}.dmg ($(du -h "dist_pkg/AIC-${TAG}.dmg" | cut -f1))"

      # ── 15. Package Size & Compression Breakdown ──────────────────────────
      - name: "Package Size & Compression Measurement"
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          echo "=== FINAL PACKAGE SIZE & COMPRESSION REPORT (${{ matrix.platform }}) ==="
          if [ -d "dist_pkg" ]; then
            ls -lh dist_pkg/
          fi

      # ── 16. Upload Raw Build Artifacts (CI inspection) ────────────────────
      - name: "Upload ${{ matrix.platform }} raw build artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "aic-${{ matrix.platform }}-${{ github.sha }}"
          path: ${{ matrix.artifact_path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      # ── 17. Upload Final Packages Artifact (For Release job) ───────────────
      - name: "Upload ${{ matrix.platform }} packages artifact"
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: "aic-${{ matrix.platform }}-packages-${{ github.sha }}"
          path: dist_pkg/
          if-no-files-found: error
          retention-days: 7

      # ── 18. Upload Crash Logs (Windows) ────────────────────────────────────
      - name: "Upload crash logs artifact"
        if: always() && matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: "crash-logs-${{ github.sha }}"
          path: |
            aic_boot_trace.log
            aic_crash.log
            stdout.txt
            stderr.txt
            build/windows/aic_boot_trace.log
            build/windows/aic_crash.log
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Job Release — uniquement sur push d'un tag v*
  # Dépend du job build (matrice windows + linux + macos).
  # Télécharge les 4 packages finaux et publie la GitHub Release officielle.
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: "GitHub Release"
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:

      # ── 1. Checkout repository (Accès à RELEASE_NOTES_v2.1.0.md) ───────────
      - name: "Checkout repository"
        uses: actions/checkout@v4

      # ── 2. Téléchargement des packages compilés ────────────────────────────
      - name: "Download all package artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: "aic-*-packages-*"
          path: release_dist/
          merge-multiple: true

      # ── 3. Audit des packages avant publication ───────────────────────────
      - name: "Audit Release Packages"
        run: |
          echo "=== RELEASE PACKAGES AUDIT ==="
          ls -lh release_dist/

          TAG="${GITHUB_REF#refs/tags/}"

          EXPECTED_FILES=(
            "release_dist/AIC-Setup-${TAG}.exe"
            "release_dist/AIC-Portable-${TAG}.zip"
            "release_dist/AIC-${TAG}.AppImage"
            "release_dist/AIC-${TAG}.dmg"
          )

          MISSING=0
          for f in "${EXPECTED_FILES[@]}"; do
            if [ -f "$f" ]; then
              echo "FOUND: $f ($(du -h "$f" | cut -f1))"
            else
              echo "::error::MISSING REQUIRED PACKAGE: $f"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "::error::RELEASE CANCELLED: $MISSING package(s) missing from artifact downloads!"
            exit 1
          fi

          RELEASE_NOTES_FILE="RELEASE_NOTES_${TAG}.md"
          if [ ! -f "${RELEASE_NOTES_FILE}" ]; then
            echo "::warning::${RELEASE_NOTES_FILE} not found! Falling back to RELEASE_NOTES_v2.1.0.md"
            RELEASE_NOTES_FILE="RELEASE_NOTES_v2.1.0.md"
          fi

          if [ ! -f "${RELEASE_NOTES_FILE}" ]; then
            echo "::error::Release notes file missing!"
            exit 1
          fi

          echo "Release Notes file selected: ${RELEASE_NOTES_FILE}"

      # ── 4. Publication de la GitHub Release ───────────────────────────────
      - name: "Publish GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES_v2.1.0.md
          files: |
            release_dist/AIC-Setup-*.exe
            release_dist/AIC-Portable-*.zip
            release_dist/AIC-*.AppImage
            release_dist/AIC-*.dmg
